<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NRSuite Authorized Test Portal</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #090b0a; color: #e8f5e9; }
    main { width: min(92vw, 34rem); padding: 2rem; border: 1px solid #2e7d32;
           border-radius: 14px; background: #111613; }
    h1 { color: #8bff9b; margin-top: 0; }
    input, button { width: 100%; box-sizing: border-box; padding: .8rem;
                    margin-top: .75rem; border-radius: 8px; }
    input { background: #0b0d0c; color: inherit; border: 1px solid #3e4a40; }
    button { background: #8bff9b; color: #071108; font-weight: 700; border: 0; }
    small { color: #a8b8aa; }
  </style>
</head>
<body>
  <main>
    <h1>NRSuite test portal</h1>
    <p><strong>#SSID#</strong></p>
    <p>This page is a local example for authorized captive-portal testing only.</p>
    <form method="post" action="/login">
      <input name="username" autocomplete="username" placeholder="Test username">
      <input name="password" type="password" autocomplete="current-password" placeholder="Test password">
      <button type="submit">Continue</button>
    </form>
    <p><small>Use only on networks and devices you own or are explicitly authorized to test.</small></p>
  </main>
</body>
</html>
